# Amplify Hosting: static page only. The /api/* routes run on the
# ucc-lookup-api Lambda (infra/template.yaml); Amplify proxies /api/<*> to
# its Function URL via the app's rewrite rule. No secrets here.
version: 1
frontend:
  phases:
    build:
      commands:
        - STATIC_ONLY=1 node build.js
  artifacts:
    baseDirectory: .
    files:
      - index.html
      - docs.html
